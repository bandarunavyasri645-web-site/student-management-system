<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }
        form, .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex: 1;
            min-width: 150px;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        button.edit-btn {
            background-color: #ffc107;
            color: black;
        }
        button.edit-btn:hover {
            background-color: #e0a800;
        }
        button.delete-btn {
            background-color: #dc3545;
        }
        button.delete-btn:hover {
            background-color: #c82333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        #update-form-container {
            display: none;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>

        <div class="controls">
            <div id="add-student-section">
                <h2>Add Student</h2>
                <form id="student-form">
                    <input type="text" id="name" placeholder="Enter student name" required>
                    <input type="text" id="roll" placeholder="Enter roll number" required>
                    <button type="submit">Add Student</button>
                </form>
            </div>

            <div id="search-section">
                <h2>Search Student</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search by name or roll number...">
                </div>
            </div>
        </div>

        <div id="update-form-container">
            <h2>Update Student</h2>
            <form id="update-form">
                <input type="hidden" id="update-index">
                <input type="text" id="update-name" placeholder="Update student name" required>
                <input type="text" id="update-roll" placeholder="Update roll number" required>
                <button type="submit">Update Student</button>
                <button type="button" onclick="cancelUpdate()" style="background-color: #6c757d;">Cancel</button>
            </form>
        </div>

        <div id="view-students-section">
            <h2>Student List</h2>
            <table id="student-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-list">
                    <!-- Students will be added here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('students')) || [];

        const studentForm = document.getElementById('student-form');
        const updateForm = document.getElementById('update-form');
        const updateContainer = document.getElementById('update-form-container');
        const studentList = document.getElementById('student-list');
        const searchInput = document.getElementById('search-input');

        function renderStudents(filter = '') {
            studentList.innerHTML = '';
            const filteredStudents = students.filter(student =>
                student.name.toLowerCase().includes(filter.toLowerCase()) ||
                student.roll.toLowerCase().includes(filter.toLowerCase())
            );

            filteredStudents.forEach((student) => {
                const actualIndex = students.indexOf(student);
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = student.name;

                const rollCell = document.createElement('td');
                rollCell.textContent = student.roll;

                const actionsCell = document.createElement('td');
                actionsCell.className = 'actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'edit-btn';
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => editStudent(actualIndex);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteStudent(actualIndex);

                actionsCell.appendChild(editBtn);
                actionsCell.appendChild(deleteBtn);

                row.appendChild(nameCell);
                row.appendChild(rollCell);
                row.appendChild(actionsCell);

                studentList.appendChild(row);
            });
        }

        studentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const roll = document.getElementById('roll').value;

            students.push({ name, roll });
            saveAndRender();

            studentForm.reset();
            alert('Student added successfully!');
        });

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student?')) {
                students.splice(index, 1);
                saveAndRender();
            }
        }

        function editStudent(index) {
            const student = students[index];
            document.getElementById('update-index').value = index;
            document.getElementById('update-name').value = student.name;
            document.getElementById('update-roll').value = student.roll;
            updateContainer.style.display = 'block';
            window.scrollTo(0, updateContainer.offsetTop);
        }

        updateForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const index = document.getElementById('update-index').value;
            const name = document.getElementById('update-name').value;
            const roll = document.getElementById('update-roll').value;

            students[index] = { name, roll };
            saveAndRender();

            cancelUpdate();
            alert('Student updated successfully!');
        });

        function cancelUpdate() {
            updateContainer.style.display = 'none';
            updateForm.reset();
        }

        searchInput.addEventListener('input', (e) => {
            renderStudents(e.target.value);
        });

        function saveAndRender() {
            localStorage.setItem('students', JSON.stringify(students));
            renderStudents(searchInput.value);
        }

        // Initial render
        renderStudents();
    </script>
</body>
</html>
